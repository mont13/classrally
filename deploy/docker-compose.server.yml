# ClassRally — deployment behind an existing reverse proxy (same or other host)
#
# Standalone compose file: do NOT combine it with ../docker-compose.yml,
# which publishes the port on 0.0.0.0 (compose concatenates `ports` from
# override files). Here the port is bound only to the address given in
# CLASSRALLY_BIND_ADDR (127.0.0.1, or an internal IP the proxy reaches).
#
# Usage (paths are examples; full guide incl. accounts: docs/NASAZENI.md):
#   docker compose --env-file /etc/classrally/classrally.env \
#     -f deploy/docker-compose.server.yml -p classrally up -d --build
#
# Required variables in the env file:
#   CLASSRALLY_BIND_ADDR  internal IP to publish the port on (never 0.0.0.0)
#   CLASSRALLY_DATA_DIR   persistent data root; needs data/ history/
#                         questions/ uploads/ audio/ owned by CLASSRALLY_UID
#   QUIZ_BASE_URL         public URL, e.g. https://classrally.example.com
#   QUIZ_ADMIN_PASSWORD   /admin password — without it the admin portal is
#                         open to anyone until the first teacher registers
# Optional: AI_* (question generator), MAIL_MODE/MAIL_FROM/SMTP_* (e-mail,
# default MAIL_MODE=log writes messages to data/outbox and sends nothing),
# QUIZ_ROOMS=multi (several teachers: a room with a PIN per teacher and
# separate data; default single = one shared game)
#
# The admin password is passed via the environment only (the default command
# in the Dockerfile would also put it on the process command line).

services:
  classrally:
    build:
      context: ..
    image: classrally:server
    container_name: ${CLASSRALLY_CONTAINER:-classrally}
    restart: unless-stopped
    user: "${CLASSRALLY_UID:-1000}:${CLASSRALLY_GID:-1000}"
    command: ["python3", "server.py", "--host", "0.0.0.0", "--port", "48217"]
    # Single container, no siblings to talk to: use Docker's default bridge
    # instead of creating a project network (busy hosts run out of pools).
    network_mode: bridge
    ports:
      - "${CLASSRALLY_BIND_ADDR:?set CLASSRALLY_BIND_ADDR}:${CLASSRALLY_PORT:-48217}:48217"
    volumes:
      - ${CLASSRALLY_DATA_DIR:?set CLASSRALLY_DATA_DIR}/data:/app/data
      - ${CLASSRALLY_DATA_DIR:?set CLASSRALLY_DATA_DIR}/history:/app/history
      - ${CLASSRALLY_DATA_DIR:?set CLASSRALLY_DATA_DIR}/questions:/app/questions
      - ${CLASSRALLY_DATA_DIR:?set CLASSRALLY_DATA_DIR}/uploads:/app/static/uploads
      - ${CLASSRALLY_DATA_DIR:?set CLASSRALLY_DATA_DIR}/audio:/app/static/audio:ro
    environment:
      QUIZ_PORT: "48217"
      QUIZ_BASE_URL: ${QUIZ_BASE_URL:?set QUIZ_BASE_URL}
      QUIZ_ADMIN_PASSWORD: ${QUIZ_ADMIN_PASSWORD:?set QUIZ_ADMIN_PASSWORD}
      QUIZ_TRUSTED_PROXIES: ${QUIZ_TRUSTED_PROXIES:-}
      QUIZ_ROOMS: ${QUIZ_ROOMS:-single}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-oss:20b}
      # Outgoing e-mail (password reset, invitations); log = only data/outbox
      MAIL_MODE: ${MAIL_MODE:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    # A runaway process must not starve other containers on a shared host.
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

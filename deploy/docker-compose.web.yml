# ClassRally — web deployment overlay
#
# Extends the base docker-compose.yml to add a Caddy HTTPS reverse proxy.
# Caddy obtains and renews Let's Encrypt certificates automatically.
#
# Usage:
#   export CLASSRALLY_DOMAIN=classrally.example.com
#   export QUIZ_ADMIN_PASSWORD=secretpassword
#   docker compose -f docker-compose.yml -f deploy/docker-compose.web.yml up -d
#
# Both variables are required. Make sure DNS for the domain points to this
# server before starting. Needs Docker Compose 2.24+ (the !reset tag below).
# Full guide: docs/NASAZENI.md

services:

  # --- Override the base classrally service ---
  classrally:
    # In web deployment we do NOT expose port 48217 to the host directly;
    # traffic comes in through Caddy on 80/443. Compose concatenates `ports`
    # lists from overrides, so the base mapping must be reset explicitly.
    ports: !reset []
    # Same hardening as deploy/docker-compose.server.yml: unprivileged user,
    # no capabilities, admin password only in the environment (the default
    # command in the Dockerfile would put it on the process command line).
    user: "${CLASSRALLY_UID:?set CLASSRALLY_UID}:${CLASSRALLY_GID:?set CLASSRALLY_GID}"
    command: ["python3", "server.py", "--host", "0.0.0.0", "--port", "48217",
              "--question-time", "${QUESTION_TIME:-20}", "--reveal-time", "${REVEAL_TIME:-5}"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Tell the app its public base URL so QR codes and player URLs are correct.
      - QUIZ_BASE_URL=https://${CLASSRALLY_DOMAIN:?set CLASSRALLY_DOMAIN}
      # Inherit everything else from the base docker-compose.yml.
      - QUIZ_ADMIN_PASSWORD=${QUIZ_ADMIN_PASSWORD:?set QUIZ_ADMIN_PASSWORD}
      - QUIZ_EXTERNAL_IP=${QUIZ_EXTERNAL_IP:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - QUESTION_TIME=${QUESTION_TIME:-20}
      - REVEAL_TIME=${REVEAL_TIME:-5}
      - QUIZ_TEACHER_CODE=${QUIZ_TEACHER_CODE:-}
      - MAIL_MODE=${MAIL_MODE:-log}
      - MAIL_FROM=${MAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    # Only reachable inside the Docker network; Caddy talks to it by service name.
    networks:
      - classrally_net

  # --- Caddy reverse proxy with automatic HTTPS ---
  caddy:
    image: caddy:2-alpine
    container_name: classrally_caddy
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP (used for ACME challenge and redirect to HTTPS)
      - "443:443"  # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      # Caddyfile — the site address comes from CLASSRALLY_DOMAIN
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent storage for TLS certificates and Caddy's internal state
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Used as the site address in the Caddyfile ({$CLASSRALLY_DOMAIN}).
      - CLASSRALLY_DOMAIN=${CLASSRALLY_DOMAIN:?set CLASSRALLY_DOMAIN}
    depends_on:
      - classrally
    networks:
      - classrally_net

volumes:
  # Named volumes so TLS certificates survive container recreation
  caddy_data:
  caddy_config:

networks:
  classrally_net:
    driver: bridge

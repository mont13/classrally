# ClassRally — nginx reverse proxy configuration (site file)
#
# For ClassRally running on the same machine (systemd service or Docker bound
# to 127.0.0.1:48217). If it runs on another host, change the upstream address.
# Full guide: docs/NASAZENI.md
#
# Prerequisites:
#   1. DNS of your domain points to this server; ports 80 and 443 are open.
#   2. Replace "classrally.example.com" below with your domain.
#   3. Copy this file to /etc/nginx/sites-available/classrally and enable it:
#        ln -s /etc/nginx/sites-available/classrally /etc/nginx/sites-enabled/
#   4. Obtain a certificate (webroot; the port-80 block serves the challenge):
#        certbot certonly --webroot -w /var/www/html -d classrally.example.com
#      Until the certificate exists, comment out the 443 server block.
#   5. nginx -t && systemctl reload nginx   (never reload without nginx -t)

upstream classrally {
    server 127.0.0.1:48217;
}

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name classrally.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    # On nginx >= 1.25.1 you may use "listen 443 ssl;" + "http2 on;" instead.
    # On a shared nginx with other sites, http2 in "listen" enables HTTP/2 for
    # every site on that port — leave it out there if that is not wanted.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name classrally.example.com;

    ssl_certificate     /etc/letsencrypt/live/classrally.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classrally.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (only here: an add_header inside a location would
    # replace these for that location).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Images in question banks: max 2 MB, sent as base64 inside JSON.
    client_max_body_size 10m;

    # No caching headers on purpose: the host screen polls /api/state every
    # second and the app does not mark its responses cacheable.

    # --- WebSocket (live game) ---
    location /api/ws {
        proxy_pass http://classrally;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Everything else ---
    location / {
        proxy_pass http://classrally;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, do not append ($proxy_add_x_forwarded_for): the app uses
        # the leftmost entry as the client IP for login rate limiting.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        # AI question generation can take a while (the app waits up to 120 s).
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}

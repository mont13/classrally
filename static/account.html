<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title data-i18n="account.page_title">ClassRally – Účet</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/i18n.js"></script>
  <style>
    .login-box { max-width: 460px; margin: 60px auto; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 1.05rem; }
    .form-group input {
      width: 100%; padding: 10px; border: 2px solid #7dd3fc; border-radius: 10px;
      font-size: 1.1rem; background: var(--panel-strong); }
    .form-group input:focus { outline: 0; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.2); }
    .msg { margin-top: 12px; font-weight: 700; }
    .msg.ok { color: #166534; }
    .msg.err { color: #b91c1c; }
    .links { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    .invite-email { font-weight: 800; color: #0c4a6e; }
    #accountCard section.hide { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <div id="accountCard" class="card login-box">

      <!-- Forgotten password: request a link -->
      <section id="forgotSection" class="hide">
        <h1 data-i18n="account.forgot_title"></h1>
        <p class="muted" data-i18n="account.forgot_text"></p>
        <div class="form-group">
          <label for="forgotLogin" data-i18n="account.label_login"></label>
          <input id="forgotLogin" type="text" autocomplete="username" maxlength="254" />
        </div>
        <button class="btn good" id="btnForgot" data-i18n="account.forgot_btn"></button>
        <p id="forgotMsg" class="msg hide"></p>
        <p class="muted" style="margin-top:14px;font-size:0.9rem;" data-i18n="account.no_email_hint"></p>
      </section>

      <!-- New password from a reset link -->
      <section id="resetSection" class="hide">
        <h1 data-i18n="account.reset_title"></h1>
        <p class="muted" data-i18n="account.reset_text"></p>
        <div class="form-group">
          <label for="resetPass" data-i18n="account.label_new_password"></label>
          <input id="resetPass" type="password" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="resetPass2" data-i18n="account.label_confirm_password"></label>
          <input id="resetPass2" type="password" autocomplete="new-password" />
        </div>
        <button class="btn good" id="btnReset" data-i18n="account.reset_btn"></button>
        <p id="resetMsg" class="msg hide"></p>
      </section>

      <!-- E-mail confirmation -->
      <section id="verifySection" class="hide">
        <h1 data-i18n="account.verify_title"></h1>
        <p id="verifyMsg" class="msg" data-i18n="account.verify_working"></p>
      </section>

      <!-- Teacher invitation -->
      <section id="inviteSection" class="hide">
        <h1 data-i18n="account.invite_title"></h1>
        <p class="muted"><span data-i18n="account.invite_text"></span> <span id="inviteEmail" class="invite-email"></span></p>
        <div class="form-group">
          <label for="inviteNick" data-i18n="account.label_nickname"></label>
          <input id="inviteNick" type="text" autocomplete="username" maxlength="24" />
        </div>
        <div class="form-group">
          <label for="invitePass" data-i18n="account.label_password"></label>
          <input id="invitePass" type="password" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="invitePass2" data-i18n="account.label_confirm_password"></label>
          <input id="invitePass2" type="password" autocomplete="new-password" />
        </div>
        <button class="btn good" id="btnInvite" data-i18n="account.invite_btn"></button>
        <p id="inviteMsg" class="msg hide"></p>
      </section>

      <!-- Invalid / expired link -->
      <section id="invalidSection" class="hide">
        <h1 data-i18n="account.invalid_title"></h1>
        <p class="muted" data-i18n="account.invalid_text"></p>
        <a class="btn" href="/reset" data-i18n="account.request_new_link"></a>
      </section>

      <div class="links">
        <a class="btn ghost" href="/profile" data-i18n="account.link_profile"></a>
        <a class="btn ghost" href="/admin" data-i18n="account.link_admin"></a>
      </div>
    </div>
  </main>
  <script src="/static/account.js"></script>
</body>
</html>
